<!DOCTYPE html>
  <html lang="zh-Hant">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任務計時器</title>
  <style>
    :root{
      --void-top:#03050a;
    --void-bottom:#03050a;
    --boundary:50vh;
    --primary:#ff6a3d;
          --primary-dark:#c0431f;
          --primary-glow:rgba(255,106,61,0.55);
    --blue:#22c1e8;
    --blue-dark:#0ea5c4;
    --blue-light:#6fe0f7;
    --blue-glow:rgba(34,193,232,0.55);
    --panel:rgba(20,28,40,0.72);
    --panel-border:rgba(255,255,255,0.12);
    --text:#eef4fb;
          --text-dim:#8b97a7;
}
  *{box-sizing:border-box;}
  html,body{
        height:100%;
    margin:0;
    background:var(--void-top);
    color:var(--text);
    overflow:hidden;
    font-family:ui-sans-serif,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
  .sky{
        position:fixed;
    inset:0;
    z-index:0;
    background:url('083b18c7a231e9fd3216b3a944c9a957.jpg') center top / cover no-repeat, var(--void-top);
    -webkit-mask-image:linear-gradient(to bottom, #000 0, #000 calc(var(--boundary) - 14vh), transparent calc(var(--boundary) + 16vh));
    mask-image:linear-gradient(to bottom, #000 0, #000 calc(var(--boundary) - 14vh), transparent calc(var(--boundary) + 16vh));
}
  .planet-wrap{
        position:fixed;
    left:50%;
    top:var(--boundary);
    width:190vw;
    height:190vw;
    border-radius:50%;
    overflow:hidden;
    transform:translateX(-50%);
    pointer-events:none;
    z-index:0;
    background:#000;
    box-shadow:
      0 0 22px 4px rgba(185,240,255,0.55),
            0 0 55px 14px rgba(150,225,255,0.35),
            0 0 95px 26px rgba(120,200,255,0.18);
    transition:box-shadow 0.5s ease;
}
  .planet-wrap canvas{
        position:absolute;
    inset:0;
    width:100%;
    height:100%;
    animation:planet-spin 26s linear infinite;
    will-change:transform;
}
  @keyframes planet-spin{
        from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}
  .win-dots{
        position:fixed;
    top:24px;
    left:24px;
    z-index:2;
    display:flex;
    gap:10px;
}
  .win-dots span{
        width:11px;
    height:11px;
    border-radius:50%;
    background:rgba(255,255,255,0.28);
}
  .planet-nav{
        position:fixed;
    top:20px;
    right:20px;
    left:20px;
    z-index:2;
    display:flex;
    flex-wrap:nowrap;
    gap:6px;
    justify-content:flex-end;
    overflow-x:auto;
    scrollbar-width:none;
}
  .planet-nav::-webkit-scrollbar{display:none;}
  .chip{
    appearance:none;
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--text);
    padding:8px 18px;
    border-radius:999px;
    font-size:0.78rem;
    font-weight:600;
    letter-spacing:0.02em;
    white-space:nowrap;
    cursor:pointer;
    font-family:inherit;
    transition:background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .chip:hover{background:rgba(255,255,255,0.14);}
  .chip.is-active{
        background:#f3f6fa;
        color:#0b1420;
    border-color:transparent;
    box-shadow:0 4px 16px -4px rgba(255,255,255,0.35);
}
  main{
        position:relative;
    z-index:1;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(18px,3.5vh,36px);
    padding:24px;
}
  .status{
        font-size:clamp(0.72rem,1.4vw,0.85rem);
    letter-spacing:0.32em;
    color:var(--text-dim);
    text-transform:uppercase;
    min-height:1em;
}
  .timer{
        font-family:ui-monospace,"SF Mono",Menlo,Consolas,"JetBrains Mono",monospace;
    font-size:clamp(4.2rem,16vw,10.5rem);
    font-weight:600;
    line-height:1;
    letter-spacing:0.02em;
    font-variant-numeric:tabular-nums;
    text-align:center;
    color:var(--text);
    text-shadow:0 0 40px rgba(255,255,255,0.08);
    user-select:none;
}
  .track-wrap{
        width:min(560px,88vw);
    display:flex;
    flex-direction:column;
    align-items:center;
}
  .track{
        position:relative;
    width:100%;
    height:2px;
    border-radius:999px;
    background:rgba(255,255,255,0.18);
    overflow:visible;
    margin:0 3px;
}
  .track-fill{
        position:absolute;
    inset:0 auto 0 0;
    width:0%;
    border-radius:999px;
    background:var(--blue);
    box-shadow:0 0 12px var(--blue-glow);
    transition:width 0.25s linear;
}
  .track-dot{
        position:absolute;
    top:50%;
    width:7px;
    height:7px;
    border-radius:50%;
    transform:translate(-50%,-50%);
}
  .track-dot.start{
    left:0;
    background:var(--blue);
    box-shadow:0 0 8px var(--blue-glow);
  }
  .track-dot.end{
    left:100%;
    background:transparent;
    border:2px solid rgba(255,255,255,0.35);
  }
  .rocket{
        position:absolute;
    top:50%;
    left:0%;
    width:26px;
    height:26px;
    transform:translate(-50%,-50%) rotate(90deg);
    transition:left 0.25s linear;
    filter:drop-shadow(0 0 6px var(--blue-glow));
  }
  .rocket svg{width:100%;height:100%;display:block;}
  .track-labels{
        width:100%;
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:0.78rem;
    color:var(--text-dim);
    letter-spacing:0.04em;
}
  .controls{
        display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn{
        position:relative;
    appearance:none;
    border-radius:999px;
    padding:16px 38px;
    font-size:1rem;
    font-weight:700;
    letter-spacing:0.06em;
    cursor:pointer;
    border:1px solid var(--panel-border);
    background:var(--panel);
    color:#fff;
        overflow:hidden;
    isolation:isolate;
    transition:transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease, opacity 0.2s ease, border-color 0.2s ease;
    font-family:inherit;
  }
  .btn:active:not(:disabled){transform:scale(0.96);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn:not(.is-selected):hover:not(:disabled){background:rgba(255,255,255,0.14);}
  .btn.is-selected{
        background:linear-gradient(180deg,var(--blue-light),var(--blue-dark));
    border-color:transparent;
    color:#04222b;
    box-shadow:0 0 0 1px rgba(255,255,255,0.12) inset, 0 8px 26px -6px var(--blue-glow);
}
  #launchBtn::after{
    content:'';
          position:absolute;
    inset:0;
    z-index:-1;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='60'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:cover;
    mix-blend-mode:overlay;
    opacity:0;
    pointer-events:none;
    animation:launch-noise 5s steps(1,end) infinite;
}
  @keyframes launch-noise{
        0%,92%,100%{ opacity:0; transform:translate(0,0); }
    93%{ opacity:0.55; transform:translate(-1px,0); }
    94%{ opacity:0.15; transform:translate(1px,0); }
    95%{ opacity:0.5; transform:translate(0,1px); }
    96%{ opacity:0.1; transform:translate(-1px,-1px); }
    97%{ opacity:0.45; transform:translate(1px,0); }
    98%{ opacity:0; transform:translate(0,0); }
}
</style>
  </head>
  <body>
  <div class="sky" aria-hidden="true"></div>
  <div class="planet-wrap" aria-hidden="true">
    <canvas id="planetCanvas"></canvas>
  </div>
  <img id="planetSource" src="e25a47cddf4f6300fcc5a16d4bbf363a.jpg" alt="" style="display:none">
  <div class="win-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  <nav class="planet-nav">
    <button class="chip is-active" data-planet="earth" type="button">地球</button>
    <button class="chip" data-planet="mars" type="button">火星</button>
    <button class="chip" data-planet="moon" type="button">月球</button>
    <button class="chip" data-planet="jupiter" type="button">木星</button>
    <button class="chip" data-planet="saturn" type="button">土星</button>
  </nav>
  <main>
    <div class="status" id="status">待命發射</div>
    <div class="timer" id="timer">25:00</div>
    <div class="track-wrap">
      <div class="track" id="track">
        <div class="track-fill" id="fill"></div>
        <span class="track-dot start"></span>
        <span class="track-dot end"></span>
        <div class="rocket" id="rocket">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 1.5c2.6 2.1 4 5.3 4 9 0 2.1-.5 3.9-1.1 5.3l-2.9 3.2-2.9-3.2C8.5 14.4 8 12.6 8 10.5c0-3.7 1.4-6.9 4-9z" fill="#6fe0f7"/>
            <path d="M12 1.5c2.6 2.1 4 5.3 4 9 0 2.1-.5 3.9-1.1 5.3l-2.9 3.2V1.5z" fill="#0ea5c4"/>
            <circle cx="12" cy="10" r="1.7" fill="#0b1620"/>
            <path d="M8 12.8c-1.8.4-2.8 1.7-3.2 4.2 1.9-.6 3.1-1.3 3.9-2.4l-.7-1.8z" fill="#c7d0da"/>
            <path d="M16 12.8c1.8.4 2.8 1.7 3.2 4.2-1.9-.6-3.1-1.3-3.9-2.4l.7-1.8z" fill="#c7d0da"/>
            <path d="M10.3 19l1.7 3 1.7-3c-1.1.4-2.3.4-3.4 0z" fill="#bdf3ff"/>
          </svg>
        </div>
      </div>
      <div class="track-labels">
        <span>啟程</span>
        <span>抵達</span>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="launchBtn">發射</button>
      <button class="btn" id="standbyBtn">待機</button>
      <button class="btn" id="returnBtn">返航</button>
    </div>
  </main>

  <script>
  (function(){
    "use strict";

  /* ---------- 星球選單：切換色調，星體用半色調點陣（halftone）呈現 ---------- */
  var PLANET_THEMES = {
    earth:   { rgb: [130,205,255] },
        mars:    { rgb: [255,120,90]  },
              moon:    { rgb: [210,215,225] },
                    jupiter: { rgb: [255,175,110] },
                          saturn:  { rgb: [255,214,140] }
};

  var chips = document.querySelectorAll('.chip');
  var planetWrap = document.querySelector('.planet-wrap');
  var planetCanvas = document.getElementById('planetCanvas');
  var planetSource = document.getElementById('planetSource');
  var pctx = planetCanvas.getContext('2d');
  var SAMPLE = 900;
  var STEP = 7;
  var sampleData = null;

  function glowShadow(rgb) {
        return '0 0 22px 4px rgba(' + rgb.join(',') + ',0.55), 0 0 55px 14px rgba(' + rgb.join(',') + ',0.35), 0 0 95px 26px rgba(' + rgb.join(',') + ',0.18)';
  }

  function buildSampleData() {
        var off = document.createElement('canvas');
    off.width = SAMPLE;
    off.height = SAMPLE;
    var octx = off.getContext('2d');
    var iw = planetSource.naturalWidth, ih = planetSource.naturalHeight;
    var scale = Math.max(SAMPLE / iw, SAMPLE / ih);
    var dw = iw * scale, dh = ih * scale;
    octx.drawImage(planetSource, (SAMPLE - dw) / 2, (SAMPLE - dh) / 2, dw, dh);
    sampleData = octx.getImageData(0, 0, SAMPLE, SAMPLE).data;
  }

  function drawHalftone(rgb) {
        planetCanvas.width = SAMPLE;
    planetCanvas.height = SAMPLE;
    pctx.clearRect(0, 0, SAMPLE, SAMPLE);
    if (!sampleData) return;
    for (var y = 0; y < SAMPLE; y += STEP) {
      for (var x = 0; x < SAMPLE; x += STEP) {
        var i = (y * SAMPLE + x) * 4;
        var rawLum = (0.299 * sampleData[i] + 0.587 * sampleData[i + 1] + 0.114 * sampleData[i + 2]) / 255;
        var lum = Math.min(1, 0.22 + rawLum * 0.85);
        var radius = lum * (STEP * 0.6);
        if (radius < 0.4) continue;
        pctx.beginPath();
        pctx.fillStyle = 'rgba(' + rgb.join(',') + ',' + (0.35 + lum * 0.65).toFixed(2) + ')';
        pctx.arc(x, y, radius, 0, Math.PI * 2);
        pctx.fill();
      }
    }
  }

  function applyPlanetTheme(key) {
        var theme = PLANET_THEMES[key] || PLANET_THEMES.earth;
    planetWrap.style.boxShadow = glowShadow(theme.rgb);
    drawHalftone(theme.rgb);
    for (var j = 0; j < chips.length; j++) {
      chips[j].classList.toggle('is-active', chips[j] === activeChip);
    }
  }

  var activeChip = document.querySelector('.chip.is-active') || chips[0];
  for (var c = 0; c < chips.length; c++) {
    chips[c].addEventListener('click', function () {
            activeChip = this;
      applyPlanetTheme(this.dataset.planet);
    });
  }

  function initPlanet() {
        buildSampleData();
    applyPlanetTheme(activeChip.dataset.planet);
  }
  if (planetSource.complete && planetSource.naturalWidth) {
    initPlanet();
  } else {
    planetSource.addEventListener('load', initPlanet);
  }

  /* ---------- 計時器邏輯 ---------- */
  var TOTAL_MS = 25 * 60 * 1000;
  var remainingMs = TOTAL_MS;
  var endTime = null;
  var tickHandle = null;
  var state = 'idle'; // idle | running | paused | finished

  var timerEl = document.getElementById('timer');
  var statusEl = document.getElementById('status');
  var fillEl = document.getElementById('fill');
  var rocketEl = document.getElementById('rocket');
  var launchBtn = document.getElementById('launchBtn');
  var standbyBtn = document.getElementById('standbyBtn');
  var returnBtn = document.getElementById('returnBtn');

  function format(ms) {
        var s = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(s / 60);
    var ss = s % 60;
    return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
  }

  function currentRemaining() {
        return state === 'running' ? Math.max(0, endTime - Date.now()) : remainingMs;
  }

  function updateUI() {
        var rem = currentRemaining();
    timerEl.textContent = format(rem);

    var elapsed = TOTAL_MS - rem;
    var progress = Math.min(1, Math.max(0, elapsed / TOTAL_MS));
    fillEl.style.width = (progress * 100) + '%';
    rocketEl.style.left = (progress * 100) + '%';

    if (state === 'running') statusEl.textContent = '發射升空 · 任務進行中';
    else if (state === 'paused') statusEl.textContent = '待機中';
    else if (state === 'finished') statusEl.textContent = '任務完成 · 已返航';
    else statusEl.textContent = '待命發射';

    launchBtn.disabled = (state === 'running' || state === 'finished');
    standbyBtn.disabled = (state !== 'running');
    returnBtn.disabled = (state === 'idle');

    var selected = state === 'running' ? launchBtn : state === 'paused' ? standbyBtn : returnBtn;
    [launchBtn, standbyBtn, returnBtn].forEach(function (b) {
            b.classList.toggle('is-selected', b === selected);
    });
  }

  function tick() {
        if (state !== 'running') return;
    var rem = endTime - Date.now();
    if (rem <= 0) {
      remainingMs = 0;
      state = 'finished';
      stopTick();
      updateUI();
      return;
    }
    updateUI();
  }

  function startTick() {
        stopTick();
    tickHandle = setInterval(tick, 200);
  }
  function stopTick() {
        if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  }

  launchBtn.addEventListener('click', function () {
        if (state === 'running' || state === 'finished') return;
    if (remainingMs <= 0) return;
    endTime = Date.now() + remainingMs;
    state = 'running';
    startTick();
    updateUI();
  });

  standbyBtn.addEventListener('click', function () {
        if (state !== 'running') return;
    remainingMs = Math.max(0, endTime - Date.now());
    state = 'paused';
    stopTick();
    updateUI();
  });

  returnBtn.addEventListener('click', function () {
        stopTick();
    remainingMs = TOTAL_MS;
    endTime = null;
    state = 'idle';
    updateUI();
  });

  updateUI();
  })();
</script>
  </body>
  </html>
